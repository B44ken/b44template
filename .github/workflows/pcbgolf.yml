name: pcbgolf-route
on:
  push:
    branches: [pcbgolf-work]
  workflow_dispatch:
jobs:
  runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: collect ICU runtime
        run: |
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" ubuntu:24.04 bash -euxc 'apt-get update -qq; cd /out; apt-get download libicu74; mkdir root; for f in *.deb; do dpkg-deb -x "$f" root; done; tar -C root -czf runtime.tar.gz .; rm -rf root *.deb'
      - uses: actions/upload-artifact@v4
        with:
          name: pcbgolf-runtime
          path: out
          retention-days: 7
